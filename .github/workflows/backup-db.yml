name: Database backup

# Closes the gap scripts/backup-db.sh (manual habit) leaves open: this runs
# on a schedule so a snapshot exists even on days nobody's doing schema
# work. Built after prisma migrate diff --shadow-database-url wiped the live
# DB on 2026-08-15 with no backup to restore from — see CLAUDE.md's
# "RECURRING GOTCHAS" for the full story.
on:
  schedule:
    - cron: "17 8 * * *" # ~daily, off the :00 mark to avoid GitHub's cron congestion
  workflow_dispatch: {} # lets you trigger a backup on demand from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # pg_dump refuses to dump from a *newer* server than itself, and
      # Supabase runs Postgres 17 while Ubuntu's default postgresql-client
      # package is v16 — install the matching major version by name instead
      # (ubuntu-latest runners already have the PGDG apt repo configured,
      # which carries specific major-version packages like this).
      - name: Install postgresql-client-17
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          # Same approach as scripts/backup-db.sh: parse the connection
          # string into PG* env vars rather than handing pg_dump the raw
          # URL — the DB password contains a literal '@', which breaks
          # pg_dump's own URI parser (it splits on the first '@', not the
          # last). Node's URL parser handles this correctly. .trim() guards
          # against a trailing newline in the pasted GitHub secret (hit this
          # exact failure once — a trailing \n makes new URL() throw).
          #
          # Captured to a variable and checked explicitly rather than eval'd
          # straight from the command substitution: `set -e` does NOT
          # reliably catch a failure inside $(...) in bash, so a crash here
          # would otherwise silently eval to nothing and let pg_dump run
          # with zero PG* vars set, falling back to a local socket that
          # doesn't exist on the runner — a confusing second error masking
          # the real one (also hit this exact failure once).
          #
          # Also strips a surrounding quote pair and/or a leading "DIRECT_URL="
          # in case the secret was pasted straight from the .env line rather
          # than just the value — both are easy copy mistakes and cheap to
          # handle automatically instead of erroring and asking for a re-paste.
          #
          # On failure, prints ONLY booleans/lengths, never any slice of the
          # actual value — GitHub's log masking only redacts an exact, whole
          # match of a registered secret, not fragments, so printing even a
          # short prefix of a real secret would leak it into the log unmasked.
          PARSED=$(node -e "
            let raw = (process.env.DIRECT_URL || '').trim();
            raw = raw.replace(/^DIRECT_URL=/, '');
            raw = raw.replace(/^[\"']|[\"']\$/g, '');
            try {
              const u = new URL(raw);
              console.log('export PGHOST=' + JSON.stringify(u.hostname));
              console.log('export PGPORT=' + JSON.stringify(u.port || '5432'));
              console.log('export PGUSER=' + JSON.stringify(decodeURIComponent(u.username)));
              console.log('export PGPASSWORD=' + JSON.stringify(decodeURIComponent(u.password)));
              console.log('export PGDATABASE=' + JSON.stringify(u.pathname.replace(/^\//, '')));
            } catch (e) {
              console.error('DIRECT_URL failed to parse as a URL.');
              console.error('  length=' + raw.length);
              console.error('  startsWithPostgresScheme=' + (raw.startsWith('postgresql://') || raw.startsWith('postgres://')));
              console.error('  containsNewline=' + raw.includes(String.fromCharCode(10)));
              console.error('  containsSpace=' + raw.includes(' '));
              console.error('  containsAtSign=' + raw.includes('@'));
              process.exit(1);
            }
          ") || { echo "::error::Failed to parse DIRECT_URL — see the diagnostic lines above (no secret content is ever printed)"; exit 1; }
          eval "$PARSED"
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges -f "dex_${STAMP}.sql"
          echo "DUMP_FILE=dex_${STAMP}.sql" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dex-db-backup-${{ github.run_id }}
          path: ${{ env.DUMP_FILE }}
          retention-days: 30
